services:
  postgres:
    image: postgres:17.6
    # 호스트의 다른 Postgres(5432)와 충돌하지 않도록 전용 포트 사용
    container_name: axum-sqlx-postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: axum-sqlx-postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d axum-sqlx-postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/axum-sqlx-postgres
      JWT_SECRET: ${JWT_SECRET:-dev_change_me}
      RUST_LOG: axum-sqlx-postgres=debug,tower_http=debug,sqlx=warn
    ports:
      - "8000:8000"
    restart: unless-stopped
