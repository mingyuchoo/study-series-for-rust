[package]
  edition = "2024"
  name    = "infrastructure"
  version = "0.1.0"

[dependencies]
  application = {path = "../application"}
  async-trait = "0.1"
  domain      = {path = "../domain"}
  sqlx        = {features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono"], version = "0.7"}
  tokio       = {features = ["full"], version = "1.0"}
  uuid        = {features = ["v4"], version = "1.0"}
