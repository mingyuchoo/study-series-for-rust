[package]
  edition = "2024"
  name    = "presentation_frontend"
  version = "0.1.0"

[dependencies]
  console_error_panic_hook = "0.1.7"
  js-sys                   = "0.3"
  leptos                   = {features = ["csr"], version = "0.8"}
