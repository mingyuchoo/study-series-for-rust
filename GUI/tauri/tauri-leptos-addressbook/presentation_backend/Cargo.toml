[package]
  edition = "2024"
  name    = "presentation_backend"
  version = "0.1.0"

[dependencies]
  application         = {path = "../application"}
  domain              = {path = "../domain"}
  infrastructure      = {path = "../infrastructure"}
  serde               = {features = ["derive"], version = "1"}
  serde_json          = "1"
  sqlx                = {features = ["runtime-tokio-rustls", "sqlite", "uuid"], version = "0.7"}
  tauri               = {features = [], version = "2"}
  tauri-plugin-opener = "2"
  tokio               = {features = ["full"], version = "1.0"}
  uuid                = {features = ["v4", "serde"], version = "1.0"}
