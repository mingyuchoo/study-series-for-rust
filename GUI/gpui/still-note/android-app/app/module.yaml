product: android/app
description: Stillnote Android adapters and Jetpack Compose application.

settings:
  android:
    namespace: app.stillnote
    applicationId: app.stillnote
    compileSdk: 36
    minSdk: 36
    targetSdk: 36
    buildToolsVersion: 36.0.0
    versionCode: 1
    versionName: '1.0'
  kotlin:
    version: 2.2.21
    serialization:
      format: json
      version: 1.9.0
    # Use AndroidX Compose with the existing BOM, without adding Multiplatform runtime dependencies.
    compilerPlugins:
      - id: androidx.compose.compiler.plugins.kotlin
        dependency: org.jetbrains.kotlin:kotlin-compose-compiler-plugin-embeddable:2.2.21
  jvm:
    jdk:
      version: 17
    release: 17
  junit: junit-4

dependencies:
  - //core
  - bom: androidx.compose:compose-bom:2025.10.01
  - androidx.activity:activity-compose:1.11.0
  - androidx.compose.material3:material3
  - androidx.compose.ui:ui-tooling-preview
  - androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4
  - androidx.lifecycle:lifecycle-runtime-compose:2.9.4
  - org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2

test-dependencies:
  - junit:junit:4.13.2
  - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2

test-settings:
  jvm:
    test:
      systemProperties:
        stillnote.compatibility.output: ../build/compatibility-roundtrip.json
