[package]
name = "stillnote"
version = "0.1.0"
edition = "2024"

[features]
default = []
test-support = ["gpui/test-support"]

[dependencies]
gpui = "=0.2.2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
unicode-segmentation = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0
