[workspace]
resolver = "3"
members = [
  "crates/gm-core",
  "crates/gm-store",
  "crates/gm-runner",
  "crates/gm-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mgch/generation-manager"

[workspace.dependencies]
gm-core = { path = "crates/gm-core" }
gm-store = { path = "crates/gm-store" }
gm-runner = { path = "crates/gm-runner" }

anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"

[profile.release]
strip = true
lto = "thin"
