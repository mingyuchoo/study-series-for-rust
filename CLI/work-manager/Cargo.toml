[workspace]
resolver = "3"
members = [
  "crates/wm-core",
  "crates/wm-store",
  "crates/wm-runner",
  "crates/wm-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mgch/work-manager"

[workspace.dependencies]
wm-core = { path = "crates/wm-core" }
wm-store = { path = "crates/wm-store" }
wm-runner = { path = "crates/wm-runner" }

anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"

[profile.release]
strip = true
lto = "thin"
