[package]
  edition = "2024"
  name    = "backend"
  version = "0.1.0"

[dependencies]
  actix-files       = "0.7.0"
  actix-web         = "4.15.0"
  async-trait       = "0.1.92"
  chrono            = {features = ["serde"], version = "0.4.45"}
  clap              = {features = ["derive"], version = "4.6.7"}
  serde             = {features = ["derive"], version = "1.0.229"}
  serde_json        = "1.0.151"
  sqlx              = {features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "chrono", "uuid"], version = "0.9.0"}
  tokio             = {features = ["full"], version = "1.53.2"}
  utoipa            = {features = ["actix_extras", "chrono"], version = "6.0.0"}
  utoipa-swagger-ui = {features = ["actix-web", "vendored"], version = "10.0.1"}
  uuid              = {features = ["v4", "serde"], version = "1.27.0"}
