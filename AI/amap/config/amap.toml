# AMAP platform settings. Every key can be overridden with AMAP_<KEY> environment variables.
# database_url = "postgres://amap:amap@localhost:5432/amap"   # unset → in-memory knowledge store
# nats_url = "nats://localhost:4222"                          # unset → in-memory event bus
lake = ".amap/lake"                                            # or "s3://amap-evidence/lake" (MinIO/S3)
# llm_gateway_url = "http://localhost:8090"                   # unset → embedded gateway (needs provider keys)
# llm_gateway_token = "replace-with-a-third-long-random-secret"
control_plane_listen = "127.0.0.1:8080"
llm_gateway_listen = "127.0.0.1:8090"
worker_listen = "127.0.0.1:50051"
json_logs = false
# otlp_endpoint = "http://localhost:4317"
token_budget = 0
# api_token = "replace-with-a-long-random-secret"
# worker_token = "replace-with-a-different-long-random-secret"
# verifier_endpoint = "https://verification-worker.internal:50051"
spec_root = "."
web_dist = "web/dist"
worker_root = "."
worker_allowed_executables = "python3,python,cargo,java,javac"
worker_artifact_max_bytes = 67108864
insecure_dev = false
# --- OIDC reviewer authentication (required for HITL decisions outside insecure_dev) ---
# oidc_issuer = "https://idp.example.com/realms/amap"   # issuer of ID/access tokens
# oidc_audience = "amap-control-plane"                  # expected `aud` claim (strongly recommended)
# oidc_jwks_url = "https://idp.example.com/realms/amap/protocol/openid-connect/certs"  # default: discovery
oidc_roles_claim = "roles"                              # e.g. "realm_access.roles" for Keycloak
# oidc_reviewer_role = "amap-sme"                       # role required to approve/reject HITL reviews
# worker_tls_cert = "certs/worker.pem"
# worker_tls_key = "certs/worker-key.pem"
# worker_tls_client_ca = "certs/control-plane-ca.pem"
# verifier_tls_ca = "certs/worker-ca.pem"
# verifier_tls_cert = "certs/control-plane.pem"
# verifier_tls_key = "certs/control-plane-key.pem"
# verifier_tls_domain = "verification-worker.internal"
