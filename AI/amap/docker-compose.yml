# Local platform dependencies (stack §18/§19). Run: docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: amap
      POSTGRES_PASSWORD: amap
      POSTGRES_DB: amap
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  nats:
    image: nats:2.10
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "1G", "--kafka-addr", "0.0.0.0:9092", "--advertise-kafka-addr", "localhost:9092"]
    ports: ["9092:9092"]
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: amap
      MINIO_ROOT_PASSWORD: amapamap
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]
  prometheus:
    image: prom/prometheus:latest
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: amap
volumes:
  pgdata: {}
  minio: {}
