openapi: 3.1.0
info:
  title: AMAP Control Plane API
  version: 0.1.0
  description: |
    Evidence-driven modernization control-plane contract. Protected endpoints accept either the
    operator service token or an OIDC bearer token from the configured issuer, unless the server
    runs in isolated insecure development mode. HITL decisions (`POST /v1/reviews/{id}/decide`)
    additionally require an OIDC-verified human; the service token and the `X-AMAP-Actor`
    header are never sufficient to approve or reject a review.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: health
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            text/plain:
              schema:
                type: string
  /openapi.yaml:
    get:
      operationId: getOpenApi
      security: []
      responses:
        "200":
          description: This OpenAPI contract.
          content:
            application/yaml:
              schema:
                type: string
  /v1/specs:
    get:
      operationId: listSpecs
      responses:
        "200":
          description: Run specifications available beneath the configured specification root.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpecSummary"
  /v1/paths:
    get:
      operationId: listPaths
      parameters:
        - name: purpose
          in: query
          required: true
          schema:
            type: string
            enum: [source, destination]
        - name: parent
          in: query
          required: false
          schema:
            type: string
            default: "."
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Direct child directories beneath the configured worker root.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PathListing"
        "400":
          $ref: "#/components/responses/ProblemError"
        "403":
          $ref: "#/components/responses/ProblemError"
  /v1/runs/preflight:
    post:
      operationId: preflightRun
      parameters:
        - $ref: "#/components/parameters/Actor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRunRequest"
      responses:
        "200":
          description: Validation results. Field validation failures are represented by valid=false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreflightResponse"
  /v1/runs:
    get:
      operationId: listRuns
      responses:
        "200":
          description: Known workflow runs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowRun"
    post:
      operationId: startRun
      parameters:
        - $ref: "#/components/parameters/Actor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRunRequest"
      responses:
        "200":
          description: The newly started run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        "400":
          $ref: "#/components/responses/ProblemError"
        "403":
          $ref: "#/components/responses/ProblemError"
        "409":
          $ref: "#/components/responses/ProblemError"
  /v1/runs/{id}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getRun
      responses:
        "200":
          description: Workflow run state, checkpoint, and final outcome when complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        "404":
          $ref: "#/components/responses/TextError"
  /v1/runs/{id}/events:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: streamRunEvents
      description: Replays in-memory history for the run and then streams new control-plane events.
      responses:
        "200":
          description: Server-sent event stream. Each data field is a serialized ControlEvent.
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/TextError"
  /v1/runs/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: resumeRun
      parameters:
        - $ref: "#/components/parameters/Actor"
      responses:
        "200":
          description: The resumed run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        "404":
          $ref: "#/components/responses/TextError"
        "409":
          $ref: "#/components/responses/TextError"
  /v1/functions:
    get:
      operationId: listFunctions
      responses:
        "200":
          description: Discovered business functions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessFunction"
  /v1/functions/{id}/{resource}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: resource
        in: path
        required: true
        schema:
          type: string
          enum: [requirements, rules, behaviors, scenarios, decisions, evidence, certificate]
    get:
      operationId: getFunctionResource
      responses:
        "200":
          description: Requested function resource. Shape depends on the resource parameter.
          content:
            application/json:
              schema: {}
        "404":
          $ref: "#/components/responses/TextError"
  /v1/reviews:
    get:
      operationId: listReviews
      responses:
        "200":
          description: Human review requests.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewRequest"
  /v1/reviews/{id}/decide:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: decideReview
      description: |
        Record a HITL decision. The decider is the verified `sub` of the OIDC bearer token; when
        `AMAP_OIDC_REVIEWER_ROLE` is configured the token must carry that role in the configured
        roles claim. Cedar governance (`decide_review`) is evaluated before the decision is stored.
      parameters:
        - $ref: "#/components/parameters/Actor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecision"
      responses:
        "200":
          description: Decision recorded.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  decided_by:
                    type: string
                  decided_via:
                    type: string
                  ok:
                    type: boolean
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"
  /v1/events:
    get:
      operationId: listEvents
      responses:
        "200":
          description: In-memory event history for all runs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ControlEvent"
  /v1/evidence/query:
    get:
      operationId: queryEvidence
      parameters:
        - name: sql
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rows returned by a read-only DataFusion SELECT query.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        "400":
          $ref: "#/components/responses/TextError"
  /v1/graph.dot:
    get:
      operationId: getKnowledgeGraphDot
      responses:
        "200":
          description: Current knowledge graph in Graphviz DOT format.
          content:
            text/plain:
              schema:
                type: string
  /v1/llm/audit:
    get:
      operationId: getLlmAudit
      description: |
        Durable, append-only ledger of LLM calls (newest first). Shared with a standalone
        llm-gateway when both services use the same database.
      parameters:
        - name: run_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 500
      responses:
        "200":
          description: LLM audit entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LlmAuditEntry"
  /metrics:
    get:
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus metrics.
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Actor:
      name: X-AMAP-Actor
      in: header
      required: false
      description: Self-declared actor name. Trusted only in insecure development mode.
      schema:
        type: string
        maxLength: 128
    RunId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    TextError:
      description: Request failed.
      content:
        text/plain:
          schema:
            type: string
    ProblemError:
      description: Structured request failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
  schemas:
    Priority:
      type: string
      enum: [P0, P1, P2, P3]
    SpecSummary:
      type: object
      required: [path, function_id, name, domain, priority, description, mock_available, runnable]
      properties:
        path:
          type: string
        function_id:
          type: string
        name:
          type: string
        domain:
          type: string
        priority:
          $ref: "#/components/schemas/Priority"
        description:
          type: string
        mock_available:
          type: boolean
        runnable:
          type: boolean
        unavailable_reason:
          type: string
        defaults:
          $ref: "#/components/schemas/SpecDefaults"
    SpecDefaults:
      type: object
      required: [source_path, destination_path]
      properties:
        source_path:
          type: string
        destination_path:
          type: string
    PathInput:
      type: object
      required: [type, path]
      properties:
        type:
          type: string
          enum: [local_path]
        path:
          type: string
    RunInputs:
      type: object
      required: [source, destination]
      properties:
        source:
          $ref: "#/components/schemas/PathInput"
        destination:
          $ref: "#/components/schemas/PathInput"
    StartRunRequest:
      type: object
      required: [spec]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        spec:
          type: string
        source:
          $ref: "#/components/schemas/PathInput"
        destination:
          $ref: "#/components/schemas/PathInput"
        mock:
          type: boolean
          default: false
        validation_token:
          type: string
    FieldIssue:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    PreflightEffective:
      type: object
      required: [name, function_id, spec, source_path, destination_path, source_file_count, destination_state]
      properties:
        name:
          type: string
        function_id:
          type: string
        spec:
          type: string
        source_path:
          type: string
        destination_path:
          type: string
        source_file_count:
          type: integer
          minimum: 0
        destination_state:
          type: string
          enum: [empty, will_create]
    PreflightResponse:
      type: object
      required: [valid, errors, warnings]
      properties:
        valid:
          type: boolean
        validation_token:
          type: string
        expires_at:
          type: string
          format: date-time
        effective:
          $ref: "#/components/schemas/PreflightEffective"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldIssue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/FieldIssue"
    PathEntry:
      type: object
      required: [name, path, kind, readable, writable]
      properties:
        name:
          type: string
        path:
          type: string
        kind:
          type: string
          enum: [directory]
        readable:
          type: boolean
        writable:
          type: boolean
    PathListing:
      type: object
      required: [path, parent, entries, truncated]
      properties:
        path:
          type: string
        parent:
          type: [string, "null"]
        entries:
          type: array
          items:
            $ref: "#/components/schemas/PathEntry"
        truncated:
          type: boolean
    ApiProblem:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        field:
          type: string
        request_id:
          type: string
    WorkflowRun:
      type: object
      required: [id, display_name, function_id, status, spec_path, mock, started_by, started_at, updated_at, checkpoint]
      properties:
        id:
          type: string
        display_name:
          type: string
        function_id:
          type: string
        status:
          type: string
          enum: [running, halted, certified, failed, error]
        spec_path:
          type: string
          description: Specification path relative to spec_root.
        inputs:
          oneOf:
            - $ref: "#/components/schemas/RunInputs"
            - type: "null"
        mock:
          type: boolean
        started_by:
          type: string
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        outcome:
          oneOf:
            - $ref: "#/components/schemas/WorkflowOutcome"
            - $ref: "#/components/schemas/ErrorOutcome"
            - type: "null"
        checkpoint:
          type: object
          additionalProperties: true
    BusinessFunction:
      type: object
      required: [id, name, domain, priority, description]
      properties:
        id:
          type: string
        name:
          type: string
        domain:
          type: string
        priority:
          $ref: "#/components/schemas/Priority"
        description:
          type: string
    ReviewStatus:
      type: string
      enum: [pending, approved, rejected]
    HitlTier:
      type: string
      enum: [auto, ai_cross_review, expert_review, sme_mandatory]
    ReviewRequest:
      type: object
      required: [id, function_id, tier, reason, uncertainty, status, requested_at]
      properties:
        id:
          type: string
        run_id:
          type: [string, "null"]
        function_id:
          type: string
        tier:
          $ref: "#/components/schemas/HitlTier"
        reason:
          type: string
        uncertainty:
          type: number
          format: double
        status:
          $ref: "#/components/schemas/ReviewStatus"
        requested_at:
          type: string
          format: date-time
        decided_by:
          type: [string, "null"]
          description: Verified OIDC subject of the decider, or the automation that decided.
        decided_via:
          type: [string, "null"]
          description: "`oidc:<issuer>`, `auto_approve_hitl`, or `insecure-dev-header`."
        decided_at:
          type: [string, "null"]
          format: date-time
    LlmAuditEntry:
      type: object
      required: [audit_id, content_hash, at, role, task, prompt_version, provider, model, input_tokens, output_tokens, cached, cost_usd, request_hash, pii_masked]
      properties:
        audit_id:
          type: string
        content_hash:
          type: string
        at:
          type: string
          format: date-time
        run_id:
          type: [string, "null"]
        role:
          type: string
        task:
          type: string
        prompt_version:
          type: string
        provider:
          type: string
        model:
          type: string
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cached:
          type: boolean
        cost_usd:
          type: number
          format: double
        request_hash:
          type: string
        pii_masked:
          type: boolean
    ReviewDecision:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected]
    ControlEvent:
      type: object
      required: [subject, run_id, function_id, payload, at]
      properties:
        subject:
          type: string
        run_id:
          type: string
        function_id:
          type: string
        payload: {}
        at:
          type: string
          format: date-time
    StepStatus:
      type: string
      enum: [succeeded, failed, halted, skipped]
    StepReport:
      type: object
      required: [name, role, status, attempts, summary, duration_ms]
      properties:
        name:
          type: string
        role:
          type: string
        status:
          $ref: "#/components/schemas/StepStatus"
        attempts:
          type: integer
          minimum: 0
        summary:
          type: string
        duration_ms:
          type: integer
          minimum: 0
    RunReport:
      type: object
      required: [run_id, function_id, steps, outputs]
      properties:
        run_id:
          type: string
        function_id:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/StepReport"
        outputs:
          type: object
          additionalProperties: true
        halted:
          type: [string, "null"]
        failed:
          type: [string, "null"]
    GateCheck:
      type: object
      required: [kpi, required, actual, passed]
      properties:
        kpi:
          type: string
        required:
          type: string
        actual:
          type: string
        passed:
          type: boolean
    GateReport:
      type: object
      required: [function_id, certified, checks]
      properties:
        function_id:
          type: string
        certified:
          type: boolean
        checks:
          type: array
          items:
            $ref: "#/components/schemas/GateCheck"
    WorkflowOutcome:
      type: object
      required: [reports, certified, iterations, final_outputs]
      properties:
        reports:
          type: array
          items:
            $ref: "#/components/schemas/RunReport"
        certified:
          type: boolean
        gate:
          oneOf:
            - $ref: "#/components/schemas/GateReport"
            - type: "null"
        iterations:
          type: integer
          minimum: 0
        halted:
          type: [string, "null"]
        failed:
          type: [string, "null"]
        final_outputs:
          type: object
          additionalProperties: true
    ErrorOutcome:
      type: object
      required: [error]
      properties:
        error:
          type: string
