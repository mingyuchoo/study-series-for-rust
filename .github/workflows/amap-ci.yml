name: AMAP CI

on:
  push:
    paths:
      - "AI/amap/**"
      - ".github/workflows/amap-ci.yml"
  pull_request:
    paths:
      - "AI/amap/**"
      - ".github/workflows/amap-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI/amap
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: AI/amap -> target
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --release --target wasm32-unknown-unknown --manifest-path plugins/finance/Cargo.toml --locked

  kafka-feature:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI/amap
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - run: sudo apt-get update
      - run: sudo apt-get install -y librdkafka-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: AI/amap -> target
      - run: cargo clippy -p amap-agents --features kafka --locked -- -D warnings
