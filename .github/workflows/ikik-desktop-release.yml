name: ikik-desktop-release

# Tauri 번들은 크로스 컴파일이 안 되므로(헤더 주석 참고) OS별 잡으로 팬아웃한다:
#   macOS  -> .dmg   (hdiutil/codesign, 맥에서만)
#   Debian -> .deb   (dpkg-deb)
#   Fedora -> .rpm   (rpmbuild, Fedora 컨테이너)
# `ikik-v*` 태그를 푸시(또는 수동 실행)하면 세 설치 파일이 한 번에 만들어진다.

on:
  push:
    tags:
      - "ikik-v*"
  workflow_dispatch:

permissions:
  contents: write # GitHub Release에 설치 파일을 첨부하기 위함

concurrency:
  group: ikik-release-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: GUI/tauri/ikik

jobs:
  # 테스트는 한 번만: 백엔드 크레이트는 호스트에서, 프런트엔드는 wasm 타깃
  # check로 검증한다(프런트는 wasm 전용이라 호스트 test는 돌리지 않는다).
  test:
    name: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt, rust-src, rust-analyzer

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            GUI/tauri/ikik -> target

      - name: Backend tests
        working-directory: GUI/tauri/ikik
        run: cargo test -p domain -p application -p contracts -p infrastructure

      - name: Frontend wasm check
        working-directory: GUI/tauri/ikik
        run: cargo check -p presentation_frontend --target wasm32-unknown-unknown

  bundle:
    name: ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-dmg
            os: macos-latest
            bundle: dmg
            paths: GUI/tauri/ikik/target/release/bundle/**/*.dmg
          - label: debian-deb
            os: ubuntu-22.04
            bundle: deb
            paths: GUI/tauri/ikik/target/release/bundle/**/*.deb
          - label: fedora-rpm
            os: ubuntu-22.04
            container: fedora:40
            bundle: rpm
            paths: GUI/tauri/ikik/target/release/bundle/**/*.rpm
          - label: windows-installers
            os: windows-latest
            bundle: nsis,msi
            paths: |
              GUI/tauri/ikik/target/release/bundle/**/*.exe
              GUI/tauri/ikik/target/release/bundle/**/*.msi
    steps:
      # Fedora 컨테이너는 checkout(git)·rustup 이전에 기본 도구부터 깔아야 한다.
      - name: Install Fedora dependencies
        if: matrix.container
        run: |
          dnf -y install \
            git tar gzip xz which file curl wget ca-certificates \
            gcc gcc-c++ make rpm-build \
            webkit2gtk4.1-devel gtk3-devel librsvg2-devel \
            libappindicator-gtk3-devel openssl-devel

      - uses: actions/checkout@v4

      - name: Install Debian dependencies
        if: matrix.bundle == 'deb'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf file dpkg

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt, rust-src, rust-analyzer

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            GUI/tauri/ikik -> target
          key: ${{ matrix.label }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      # release.sh/release.ps1이 요구하는 dx(Dioxus)와 cargo tauri를 설치한다.
      - name: Install dx and tauri CLIs
        run: |
          cargo binstall -y dioxus-cli@0.7.9
          cargo binstall -y tauri-cli@^2.0

      # macOS/Linux는 release.sh, Windows는 release.ps1로 같은 흐름을 탄다.
      - name: Build installer (Unix)
        if: runner.os != 'Windows'
        working-directory: GUI/tauri/ikik
        run: bash scripts/release.sh --bundles ${{ matrix.bundle }} --skip-tests --no-clean

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        working-directory: GUI/tauri/ikik
        shell: pwsh
        run: ./scripts/release.ps1 -Bundles ${{ matrix.bundle }} -SkipTests -NoClean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ikik-${{ matrix.label }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

      # 태그로 트리거된 경우 같은 릴리스에 각 플랫폼 설치 파일을 모아 첨부한다.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.paths }}
          fail_on_unmatched_files: true
