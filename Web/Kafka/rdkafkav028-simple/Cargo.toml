[profile.dev]
  codegen-units = 256
  debug         = true
  incremental   = true
  opt-level     = 1

[profile.release]
  codegen-units = 1
  debug         = false
  lto           = "thin"
  opt-level     = 3

[package]
  authors     = ["Mingyu Choo <mingyuchoo@gmail.com>"]
  build       = "build.rs"
  default-run = "producer"
  edition     = "2024"
  name        = "rdkafka-v028-simple"
  version     = "0.1.0"

[dependencies]
  async-stream = "0.3"
  axum = "0.8"
  futures-core = "0.3"
  rdkafka = {version = "0.39.0", features = ["cmake-build", "sasl", "ssl"]}
  serde = {version = "1", features = ["derive"]}
  serde_json = "1"
  tokio = {version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"]}
  tokio-util = {version = "0.7", features = ["rt"]}
  tower-http = {version = "0.6", features = ["fs"]}

[dev-dependencies]
  http-body-util = "0.1"
  tower = {version = "0.5", features = ["util"]}

[[bin]]
  name = "web"
  path = "src/server.rs"

[[bin]]
  name = "producer"
  path = "src/producer.rs"

[[bin]]
  name = "consumer"
  path = "src/consumer.rs"
